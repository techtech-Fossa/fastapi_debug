version: "3.9"
services:
  fastapi:
    build:
      context: ./app
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    ports:
      - "8001:8000" # FastAPI
      - "56781:5678" # debugpy
    command: >
      sh -c "pip install --no-cache-dir debugpy &&
      python3 -m debugpy --listen 0.0.0.0:5678 --wait-for-client
      -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
  fastapi2:
    build:
      context: ./app2
      dockerfile: Dockerfile
    volumes:
      - ./app2:/app2
    ports:
      - "8002:8000" # FastAPI
      - "56782:5678" # debugpy
    command: >
      sh -c "pip install --no-cache-dir debugpy &&
      python3 -m debugpy --listen 0.0.0.0:5678 --wait-for-client
      -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
